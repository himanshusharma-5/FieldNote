<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TraceRoom design comparison</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#0d1117;color:#dfe5eb;font:12px system-ui,sans-serif}.compare{height:100vh;display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}.col{min-width:0;overflow:hidden;border:1px solid #34404d;border-radius:7px;background:#151b23}.label{height:29px;padding:8px 10px;color:#91a0af;font:9px ui-monospace,monospace;letter-spacing:.08em}.image-wrap{height:calc(100% - 29px);display:flex;align-items:flex-start;justify-content:center;overflow:hidden;background:#10151b}.image-wrap img{width:100%;height:auto;object-fit:contain}.iframe-fit{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;background:#11161d}.live{position:absolute;inset:0 auto auto 0;width:1440px;height:810px;border:0;background:#11161d;transform:scale(.432);transform-origin:top left}
  </style>
</head>
<body>
  <main class="compare">
    <section class="col"><div class="label">SELECTED REFERENCE · OPTION 1</div><div class="image-wrap"><img src="/design-reference.png" alt="Selected incident investigation visual reference" /></div></section>
    <section class="col"><div class="label">WORKING PROTOTYPE · 1440 × 810</div><div class="iframe-fit"><iframe class="live" title="Working TraceRoom prototype" src="/"></iframe></div></section>
  </main>
</body>
</html>
